<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>আমার প্রোফাইল - SocialBoost</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার -->
    <header>
        <div class="header-left">
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="logo" onclick="location.href='index.html'">Social<span>Boost</span></div>
        </div>
        <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge">3</span>
        </div>
    </header>

    <div class="page-container">

        <!-- পেজ শিরোনাম -->
        <div class="sec-title-bar">
            <h2>আমার প্রোফাইল</h2>
        </div>

        <!-- ইউজার তথ্য কার্ড (স্ক্রিনশটের মতো) -->
        <div class="user-profile-card">
            <div class="user-avatar">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&q=80" alt="User">
            </div>
            <div class="user-meta">
                <h3>User123</h3>
                <p>user123@gmail.com</p>
                <span class="verified-tag"><i class="fa-solid fa-circle-check"></i> Verified Account</span>
            </div>
            <button class="edit-prof-btn"><i class="fa-solid fa-pen-to-square"></i></button>
        </div>

        <!-- ৩টি স্ট্যাটাস কাউন্টার বক্স -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-regular fa-clipboard" style="color: #64748b;"></i>
                <h4>12</h4>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <i class="fa-regular fa-clock" style="color: #3b82f6;"></i>
                <h4 style="color: #3b82f6;">3</h4>
                <p>Processing</p>
            </div>
            <div class="stat-card">
                <i class="fa-regular fa-circle-check" style="color: #10b981;"></i>
                <h4 style="color: #10b981;">9</h4>
                <p>Completed</p>
            </div>
        </div>

        <!-- মেনু তালিকা (আপনার স্ক্রিনশটের হুবহু আইটেমস) -->
        <div class="menu-list">
            <div class="menu-row">
                <div class="m-left"><i class="fa-solid fa-box" style="color: #3b82f6;"></i><span>আমার অর্ডার</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </div>
            <div class="menu-row">
                <div class="m-left"><i class="fa-regular fa-user" style="color: #64748b;"></i><span>আমার তথ্য</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </div>
            <div class="menu-row">
                <div class="m-left"><i class="fa-regular fa-credit-card" style="color: #64748b;"></i><span>পেমেন্ট হিস্ট্রি</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </div>
            <div class="menu-row">
                <div class="m-left"><i class="fa-regular fa-bell" style="color: #64748b;"></i><span>নোটিফিকেশন</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </div>
            <a href="https://wa.me/8801XXXXXXXXX" target="_blank" class="menu-row">
                <div class="m-left"><i class="fa-brands fa-whatsapp" style="color: #22c55e;"></i><span>সাপোর্ট (WhatsApp)</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </a>
            <div class="menu-row">
                <div class="m-left"><i class="fa-regular fa-circle-question" style="color: #64748b;"></i><span>FAQ</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </div>
            <div class="menu-row">
                <div class="m-left"><i class="fa-solid fa-gear" style="color: #8b5cf6;"></i><span>সেটিংস</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </div>
            <div class="menu-row logout-row">
                <div class="m-left"><i class="fa-solid fa-arrow-right-from-bracket" style="color: #ef4444;"></i><span style="color: #ef4444;">লগআউট</span></div>
                <i class="fa-solid fa-angle-right arrow"></i>
            </div>
        </div>

    </div>

    <!-- বটম ন্যাভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-layer-group"></i>
            <span>Products</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-fire"></i>
            <span>Special Offer</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-box-archive"></i>
            <span>Bundle Pack</span>
        </a>
        <a href="account.html" class="nav-item active">
            <i class="fa-regular fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
